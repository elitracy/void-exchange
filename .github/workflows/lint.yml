name: Lint

on:
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint (new issues only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only-new-issues needs the PR's merge base to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache

      - uses: golangci/golangci-lint-action@v6
        with:
          # "latest" resolves to the newest v1.x release, which predates
          # go1.26 support (added in v2.9.0). Pin to v2 explicitly to match
          # .golangci.yml's v2 config schema and get a go1.26-compatible binary.
          version: v2.13.2
          only-new-issues: true
